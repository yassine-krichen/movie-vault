version: "3.8"

services:
    app:
        image: tp3-app
        build:
            context: .
            dockerfile: Dockerfile
        ports:
            - "8080:8080"
        environment:
            - ConnectionStrings__DefaultConnection=Host=db;Database=tp3;Username=postgres;Password=postgres
            - ASPNETCORE_ENVIRONMENT=Development
        depends_on:
            - db

    db:
        image: postgres:16
        environment:
            - POSTGRES_DB=tp3
            - POSTGRES_USER=postgres
            - POSTGRES_PASSWORD=postgres
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data

volumes:
    postgres_data:
